name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configure MSVC for x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Install Linux libraries and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake meson ninja-build libharfbuzz-dev libfribidi-dev fonts-noto-core fonts-noto-extra

      - name: Install macOS libraries
        if: runner.os == 'macOS'
        run: brew install cmake meson ninja harfbuzz fribidi

      - name: Install Windows libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install harfbuzz:x64-windows fribidi:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "$root/bin" >> $env:GITHUB_PATH
          "INCLUDE=$root/include/harfbuzz;$env:INCLUDE" >> $env:GITHUB_ENV
          foreach ($library in @('harfbuzz', 'harfbuzz-subset', 'fribidi')) {
            $dll = Get-ChildItem "$root/bin/*.dll" | Where-Object Name -Match "^(lib)?$library(-[0-9]+)?\.dll$" | Select-Object -First 1
            if (-not $dll) { throw "Missing $library DLL" }
            $variable = $library.Replace('-', '_').ToUpper()
            "HARFBUZZY_${variable}_DLL=$($dll.Name)" >> $env:GITHUB_ENV
          }
          Copy-Item "$root/bin/*.dll" tests/
          Copy-Item "$root/bin/*.dll" examples/

      - name: Install Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install meson ninja

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: deps/harfbuzz-static
          key: ${{ runner.os }}-${{ runner.arch }}-harfbuzz-${{ hashFiles('src/harfbuzzy/private/staticHarfbuzz.nim', 'src/harfbuzzy/private/harfbuzz-static/*.cmake', 'src/harfbuzzy/private/harfbuzz-static/CMakeLists.txt') }}

      - name: Install Atlas
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          curl -fsSL --retry 3 https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh -o "$RUNNER_TEMP/install-atlas.sh"
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash "$RUNNER_TEMP/install-atlas.sh"

      - name: Install dependencies
        run: atlas install

      - name: Run dynamic tests
        if: runner.os != 'Windows'
        run: |
          nim test
          nim cpp -r --out:tests/harfbuzzy-dynamic-cpp tests/tharfbuzzy.nim
          nim c -r -d:harfbuzzRuntime tests/fixtures/optionalharfbuzz.nim
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            hbSharedFilename=libharfbuzz.dylib
          else
            hbSharedFilename=libharfbuzz.so
          fi
          export HARFBUZZ_TEST_CORE_PATH="$(pkg-config --variable=libdir harfbuzz)/$hbSharedFilename"
          nim cpp -r -d:harfbuzzRuntime tests/truntime_loading.nim
          export HARFBUZZY_TEST_FRIBIDI_PATH="$(pkg-config --variable=libdir fribidi)/${hbSharedFilename/harfbuzz/fribidi}"
          nim cpp -r -d:harfbuzzRuntime tests/tfribidi_runtime.nim
          nim c -r -d:harfbuzzRuntime "-d:harfbuzzyFribidiDynlib=(missing|)$HARFBUZZY_TEST_FRIBIDI_PATH" tests/tfribidi_runtime.nim
          nim c -r -d:harfbuzzyFribidiDynlib=missing-fribidi tests/fixtures/optionalfribidi.nim
          nim c -r -d:harfbuzzyFribidiRuntime -d:expectMissingFriBidi -d:harfbuzzyFribidiDynlib=missing-fribidi tests/tfribidi_runtime.nim
          nim c -r -d:harfbuzzRuntime -d:expectMissing -d:harfbuzzDynlib=missing-harfbuzz-core tests/truntime_loading.nim
          nim cpp -r -d:expectMissing -d:harfbuzzDynlib=missing-harfbuzz-core tests/fixtures/optionalharfbuzz.nim

      - name: Run dynamic tests with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $flags = @('--cc:vcc', '--vcc.exe:cl.exe', '--vcc.linkerexe:cl.exe', '--passC:/MT',
            "-d:harfbuzzDynlib=$env:HARFBUZZY_HARFBUZZ_DLL",
            "-d:harfbuzzSubsetDynlib=$env:HARFBUZZY_HARFBUZZ_SUBSET_DLL",
            "-d:harfbuzzyFribidiDynlib=$env:HARFBUZZY_FRIBIDI_DLL")
          nim c -r @flags tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim cpp -r @flags --out:tests/harfbuzzy-dynamic-cpp.exe tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c -r @flags tests/fixtures/optionalharfbuzz.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HARFBUZZ_TEST_CORE_PATH = $env:HARFBUZZY_HARFBUZZ_DLL
          nim cpp -r @flags -d:harfbuzzRuntime tests/truntime_loading.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:harfbuzzyFribidiDynlib=missing-fribidi tests/fixtures/optionalfribidi.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HARFBUZZY_TEST_FRIBIDI_PATH = $env:HARFBUZZY_FRIBIDI_DLL
          nim cpp -r @flags -d:harfbuzzRuntime tests/tfribidi_runtime.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:harfbuzzRuntime "-d:harfbuzzyFribidiDynlib=(missing|)$env:HARFBUZZY_FRIBIDI_DLL" tests/tfribidi_runtime.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:harfbuzzRuntime -d:expectMissingFriBidi -d:harfbuzzyFribidiDynlib=missing-fribidi tests/tfribidi_runtime.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:harfbuzzRuntime -d:expectMissing -d:harfbuzzDynlib=missing-harfbuzz-core tests/truntime_loading.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim cpp -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:expectMissing -d:harfbuzzDynlib=missing-harfbuzz-core tests/fixtures/optionalharfbuzz.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c @flags examples/shape_paragraph.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bundled static text libraries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nim c -r -d:harfbuzzyStatic \
            --passC:-Werror=incompatible-pointer-types \
            "-d:harfbuzzyStaticCache=$GITHUB_WORKSPACE/deps/harfbuzz-static" \
            -d:harfbuzzDynlib=harfbuzzy-missing-core \
            -d:harfbuzzSubsetDynlib=harfbuzzy-missing-subset \
            -d:harfbuzzyFribidiDynlib=harfbuzzy-missing-fribidi \
            --out:tests/harfbuzzy-static tests/tharfbuzzy.nim
          nim cpp -r -d:harfbuzzyStatic \
            "-d:harfbuzzyStaticCache=$GITHUB_WORKSPACE/deps/harfbuzz-static" \
            -d:harfbuzzDynlib=harfbuzzy-missing-core \
            -d:harfbuzzSubsetDynlib=harfbuzzy-missing-subset \
            -d:harfbuzzyFribidiDynlib=harfbuzzy-missing-fribidi \
            --out:tests/harfbuzzy-static-cpp tests/tharfbuzzy.nim
          nim c --app:lib --noMain -d:harfbuzzyStatic \
            "-d:harfbuzzyStaticCache=$GITHUB_WORKSPACE/deps/harfbuzz-static" \
            tests/fixtures/staticlib.nim
          nim c -r -d:harfbuzzyStatic \
            --passC:-Werror=implicit-function-declaration \
            "-d:harfbuzzyStaticCache=$GITHUB_WORKSPACE/deps/harfbuzz-static" \
            -d:harfbuzzDynlib=harfbuzzy-missing-core \
            --out:tests/harfbuzzy-static-font tests/fixtures/staticfont.nim

      - name: Test bundled static text libraries with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:harfbuzzyStatic `
            "-d:harfbuzzyStaticCache=$env:GITHUB_WORKSPACE/deps/harfbuzz-static" `
            -d:harfbuzzDynlib=harfbuzzy-missing-core `
            -d:harfbuzzSubsetDynlib=harfbuzzy-missing-subset `
            -d:harfbuzzyFribidiDynlib=harfbuzzy-missing-fribidi `
            --out:tests/harfbuzzy-static.exe tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim cpp -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            -d:harfbuzzyStatic `
            "-d:harfbuzzyStaticCache=$env:GITHUB_WORKSPACE/deps/harfbuzz-static" `
            -d:harfbuzzDynlib=harfbuzzy-missing-core `
            -d:harfbuzzSubsetDynlib=harfbuzzy-missing-subset `
            -d:harfbuzzyFribidiDynlib=harfbuzzy-missing-fribidi `
            --out:tests/harfbuzzy-static-cpp.exe tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            --passC:/we4013 -d:harfbuzzyStatic `
            "-d:harfbuzzyStaticCache=$env:GITHUB_WORKSPACE/deps/harfbuzz-static" `
            -d:harfbuzzDynlib=harfbuzzy-missing-core `
            --out:tests/harfbuzzy-static-font.exe tests/fixtures/staticfont.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify text libraries are statically linked
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            otool -L tests/harfbuzzy-static > tests/static-dependencies.txt
          else
            ldd tests/harfbuzzy-static > tests/static-dependencies.txt
          fi
          cat tests/static-dependencies.txt
          if grep -Ei 'lib(harfbuzz|fribidi)[^[:space:]]*\.(so|dylib)' tests/static-dependencies.txt; then
            echo 'The static executable depends on shared HarfBuzz or FriBidi.'
            exit 1
          fi

      - name: Verify text libraries are statically linked with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dependencies = & dumpbin /dependents tests/harfbuzzy-static.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies
          if ($dependencies -match '(?i)(lib)?(harfbuzz|fribidi)\S*\.dll') {
            throw 'The static executable depends on shared HarfBuzz or FriBidi.'
          }

      - name: Enable the Atlas static feature
        run: atlas install --features:static

      - name: Test the Atlas static feature
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nim c -r --passC:-Werror=implicit-function-declaration \
            "-d:harfbuzzyStaticCache=$GITHUB_WORKSPACE/deps/harfbuzz-static" \
            -d:harfbuzzDynlib=harfbuzzy-missing-core \
            -d:harfbuzzSubsetDynlib=harfbuzzy-missing-subset \
            -d:harfbuzzyFribidiDynlib=harfbuzzy-missing-fribidi \
            --out:tests/harfbuzzy-static-feature tests/tharfbuzzy.nim

      - name: Test the Atlas static feature with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nim c -r --cc:vcc --vcc.exe:cl.exe --vcc.linkerexe:cl.exe --passC:/MT `
            "-d:harfbuzzyStaticCache=$env:GITHUB_WORKSPACE/deps/harfbuzz-static" `
            -d:harfbuzzDynlib=harfbuzzy-missing-core `
            -d:harfbuzzSubsetDynlib=harfbuzzy-missing-subset `
            -d:harfbuzzyFribidiDynlib=harfbuzzy-missing-fribidi `
            --out:tests/harfbuzzy-static-feature.exe tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test-mingw:
    name: Windows MinGW dynlib
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_TRIPLET: x64-mingw-dynamic
      VCPKG_DEFAULT_HOST_TRIPLET: x64-mingw-dynamic
    steps:
      - uses: actions/checkout@v5

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Select the native MinGW toolchain
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc.exe).Source
          $mingwBin = Split-Path $gcc
          $target = (& $gcc -dumpmachine).Trim()
          if ($LASTEXITCODE -ne 0 -or $target -ne 'x86_64-w64-mingw32') {
            throw "Expected native x64 MinGW, got $target from $gcc"
          }
          & $gcc --version
          "HARFBUZZY_MINGW_BIN=$mingwBin" >> $env:GITHUB_ENV
          $mingwBin >> $env:GITHUB_PATH

      - name: Build MinGW shared libraries
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            'harfbuzz[core]:x64-mingw-dynamic' fribidi:x64-mingw-dynamic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-mingw-dynamic"
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "$root/bin" >> $env:GITHUB_PATH
          foreach ($library in @('harfbuzz', 'harfbuzz-subset', 'fribidi')) {
            $dll = Get-ChildItem "$root/bin/*.dll" | Where-Object Name -Match "^(lib)?$library(-[0-9]+)?\.dll$" | Select-Object -First 1
            if (-not $dll) { throw "Missing MinGW $library DLL" }
            $variable = $library.Replace('-', '_').ToUpper()
            "HARFBUZZY_${variable}_DLL=$($dll.Name)" >> $env:GITHUB_ENV
          }
          Copy-Item "$root/bin/*.dll" tests/
          Copy-Item "$root/bin/*.dll" examples/

      - name: Install Atlas
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh -o "$RUNNER_TEMP/install-atlas.sh"
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash "$RUNNER_TEMP/install-atlas.sh"

      - name: Install dependencies
        run: atlas install

      - name: Run MinGW dynlib tests
        shell: pwsh
        run: |
          $flags = @('--cc:gcc', "--gcc.path=$env:HARFBUZZY_MINGW_BIN",
            "--passC:-I`"$env:VCPKG_ROOT/include/harfbuzz`"",
            "-d:harfbuzzDynlib=$env:HARFBUZZY_HARFBUZZ_DLL",
            "-d:harfbuzzSubsetDynlib=$env:HARFBUZZY_HARFBUZZ_SUBSET_DLL",
            "-d:harfbuzzyFribidiDynlib=$env:HARFBUZZY_FRIBIDI_DLL")
          nim c -r @flags --out:tests/harfbuzzy-mingw-c.exe tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim cpp -r @flags --out:tests/harfbuzzy-mingw-cpp.exe tests/tharfbuzzy.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nim c @flags examples/shape_paragraph.nim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify HarfBuzz uses runtime loading
        shell: pwsh
        run: |
          foreach ($executable in @('tests/harfbuzzy-mingw-c.exe', 'tests/harfbuzzy-mingw-cpp.exe')) {
            $headers = & "$env:HARFBUZZY_MINGW_BIN/objdump.exe" -p $executable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($headers -match '(?i)DLL Name:\s*(lib)?(harfbuzz|fribidi)\S*\.dll') {
              throw "$executable links text DLLs instead of loading them at runtime"
            }
          }
